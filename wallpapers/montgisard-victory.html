<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Jerusalem Holds</title>
<style>html,body{margin:0;height:100%;background:#120c16;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Montgisard, 1177: Baldwin IV and the True Cross against Saladin's host, at sunrise.
   One engine, three modes: 'battle' (full loop), 'victory' (tableau), 'charge' (charge loop + victory).
   Time-based, batched drawing, built for 4K @ 120Hz.  Add #t=SECONDS to the URL to jump in time. */
'use strict';
const MODE = 'victory';
const c = document.getElementById('c');
const x = c.getContext('2d', { alpha: false });

// ------------------------------------------------------------------ helpers
const TAU = Math.PI * 2;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const smooth = t => t * t * (3 - 2 * t);
const bump = (t, a, peak, b) => t <= a || t >= b ? 0 : t < peak ? smooth((t - a) / (peak - a)) : smooth(1 - (t - peak) / (b - peak));
function hex(h) { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); }
const _mix = new Map();
function mixc(a, b, t) {
  const k = a + b + t.toFixed(3); let v = _mix.get(k); if (v) return v;
  const A = hex(a), B = hex(b);
  v = '#' + A.map((q, i) => Math.round(q + (B[i] - q) * t).toString(16).padStart(2, '0')).join('');
  _mix.set(k, v); return v;
}
function off(w, h) { const o = document.createElement('canvas'); o.width = Math.max(1, Math.ceil(w)); o.height = Math.max(1, Math.ceil(h)); return o; }

const SIL = '#1a0f14', HAZE = '#d98b63';
const COL = {
  templar: '#efe3cf', templarX: '#b3191c', hosp: '#1f1818', hospX: '#efe3cf',
  plain: ['#5a2e1f', '#3b3b55', '#6b5a2a', '#4a3a2c'], plainX: '#a31a1a',
  gold: '#e8b640', royal: '#22357a', silver: '#d4d7dc',
  ayy: '#d9a925', sarTunic: ['#7a5a2a', '#5a3a2a', '#3f4a3a', '#6b2a2a', '#8a7a4a', '#2f3f5a'],
  turban: ['#e8dcc0', '#c9b48a', '#efe6d6', '#b89a6a'], round: ['#8a2a1a', '#2a4a6a', '#c9a23a', '#4a5a3a', '#6a4a2a'],
};

let W, H, U, horizon, skyC, ripA, ripB, ripC, fore, farDunes, vign, dustSprite;
let SUN = { x: 0, y: 0, r: 0 }, TOWERS = [];
let scroll = 0, startT = null;
const T0 = parseFloat((location.hash.match(/t=([\d.]+)/) || [])[1]) || 0;

// ------------------------------------------------------------------ batched drawing
const ORDER = ['hLegFar', 'hTail', 'hBody', 'hNeck', 'hHead', 'hLeg', 'cloak', 'capa', 'capaX', 'robe', 'limb', 'pole', 'bow',
  'tab', 'tabX', 'head', 'turb', 'mask', 'maskEye', 'crown', 'mitre', 'shield', 'shieldX', 'boss', 'metal', 'sword', 'gold'];
const RIMKEYS = ['hTail', 'hBody', 'hNeck', 'hHead', 'hLeg', 'cloak', 'capa', 'robe', 'limb', 'pole', 'tab', 'head', 'turb', 'mitre', 'shield'];
class Batch {
  constructor() { this.m = new Map(); this.flags = []; this.glows = []; }
  s(key, lw, color) { return this.get(key, 's', lw, color); }
  f(key, color) { return this.get(key, 'f', 0, color); }
  get(key, mode, lw, color) {
    let b = this.m.get(key);
    if (!b) { b = { p: new Path2D(), mode, lw, color }; this.m.set(key, b); }
    return b.p;
  }
  flush(rim) {
    const draw = (b, col) => {
      if (b.mode === 's') { x.strokeStyle = col; x.lineWidth = b.lw; x.stroke(b.p); } else { x.fillStyle = col; x.fill(b.p); }
    };
    if (rim) {
      x.save(); x.translate(rim.dx, rim.dy);
      for (const pre of RIMKEYS) for (const [k, b] of this.m) if (k === pre || k.startsWith(pre + ':')) draw(b, rim.col);
      x.restore();
    }
    for (const pre of ORDER) for (const [k, b] of this.m) if (k === pre || k.startsWith(pre + ':')) draw(b, b.color);
  }
}
function seg(p, ...q) { p.moveTo(q[0], q[1]); for (let i = 2; i < q.length; i += 2) p.lineTo(q[i], q[i + 1]); }
function poly(p, q) { p.moveTo(q[0], q[1]); for (let i = 2; i < q.length; i += 2) p.lineTo(q[i], q[i + 1]); p.closePath(); }
function circ(p, cx, cy, r) { p.moveTo(cx + r, cy); p.arc(cx, cy, r, 0, TAU); }
function ell(p, cx, cy, rx, ry, rot, a0, a1) {   // lift the pen first so batched shapes never join up
  p.moveTo(cx + rx * Math.cos(a0) * Math.cos(rot) - ry * Math.sin(a0) * Math.sin(rot), cy + rx * Math.cos(a0) * Math.sin(rot) + ry * Math.sin(a0) * Math.cos(rot));
  p.ellipse(cx, cy, rx, ry, rot, a0, a1);
}

function rankStyle(s) {
  const f = clamp((1 - s) * 0.95, 0, 0.75);
  return {
    s, h: 170 * U * s, f,
    sil: mixc(SIL, HAZE, f), silFar: mixc(mixc(SIL, '#000000', 0.25), HAZE, f),
    rim: mixc('#ffd08a', HAZE, f * 0.6), metal: mixc('#8a8290', HAZE, f),
    tint: col => mixc(mixc(col, SIL, 0.25), HAZE, f), rimOn: s > 0.42,
  };
}

// ------------------------------------------------------------------ figure parts
function heater(B, cx, cy, w, hh, col, xcol, cross) {
  poly(B.f('shield:' + col, col), [cx - w / 2, cy - hh / 2, cx + w / 2, cy - hh / 2, cx + w / 2, cy + hh * 0.05, cx, cy + hh / 2, cx - w / 2, cy + hh * 0.05]);
  if (cross) { const p = B.f('shieldX:' + xcol, xcol); p.rect(cx - w * 0.1, cy - hh * 0.42, w * 0.2, hh * 0.78); p.rect(cx - w * 0.42, cy - hh * 0.2, w * 0.84, hh * 0.17); }
}
function roundShield(B, rk, cx, cy, r, col) {
  circ(B.f('shield:' + col, col), cx, cy, r);
  circ(B.f('boss', rk.metal), cx, cy, r * 0.28);
}
function tabard(B, u, rk, nx, ny, hipX, hipY, h, low) {
  if (!u.tab) return;
  const col = rk.tint(u.tab);
  poly(B.f('tab:' + col, col), [nx - 0.055 * h, ny + 0.03 * h, nx + 0.055 * h, ny + 0.03 * h, hipX + 0.075 * h, hipY + low * h, hipX - 0.075 * h, hipY + low * h]);
  if (u.tabX && rk.s > 0.33) {
    const xc = rk.tint(u.tabX), cx = (nx + hipX) / 2, p = B.f('tabX:' + xc, xc);
    p.rect(cx - 0.014 * h, ny + 0.05 * h, 0.028 * h, hipY - ny + 0.02 * h);
    p.rect(cx - 0.047 * h, ny + 0.1 * h, 0.094 * h, 0.026 * h);
  }
}
function headgear(B, u, rk, hx, hy, h) {
  const p = B.f('head', rk.sil), r = 0.072 * h;
  switch (u.helm) {
    case 'great': p.rect(hx - r * 0.95, hy - r * 1.1, r * 1.9, r * 2.05); break;
    case 'nasal': circ(p, hx, hy, r); poly(p, [hx - r * 0.9, hy - r * 0.3, hx, hy - r * 1.75, hx + r * 0.9, hy - r * 0.3]); break;
    case 'kettle': circ(p, hx, hy, r); ell(p, hx, hy - r * 0.45, r * 1.55, r * 0.32, 0, 0, TAU); break;
    case 'spike': circ(p, hx, hy, r); poly(p, [hx - r * 0.85, hy - r * 0.35, hx, hy - r * 2.2, hx + r * 0.85, hy - r * 0.35]); break;
    case 'turban': {
      circ(p, hx, hy, r);
      const col = rk.tint(u.turbCol || COL.turban[0]), q = B.f('turb:' + col, col);
      ell(q, hx - r * 0.05, hy - r * 0.5, r * 1.18, r * 0.78, 0, 0, TAU);
      if (u.turbSpike) poly(q, [hx - r * 0.25, hy - r * 1.1, hx, hy - r * 2.0, hx + r * 0.25, hy - r * 1.1]);
      break;
    }
    case 'mitre': {
      circ(p, hx, hy, r);
      const col = rk.tint('#efe6d6'), q = B.f('mitre', col);
      poly(q, [hx - r * 0.95, hy - r * 0.5, hx - r * 0.75, hy - r * 2.1, hx, hy - r * 2.7, hx + r * 0.75, hy - r * 2.1, hx + r * 0.95, hy - r * 0.5]);
      const g = B.f('gold', rk.tint(COL.gold)); g.rect(hx - r * 0.12, hy - r * 2.5, r * 0.24, r * 1.9); g.rect(hx - r * 0.95, hy - r * 0.8, r * 1.9, r * 0.25);
      break;
    }
    default: circ(p, hx, hy, r);
  }
}
function tip(B, rk, x0, y0, x1, y1, h, len) {
  const dx = x1 - x0, dy = y1 - y0, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
  poly(B.f('metal', rk.metal), [x1 + ux * len, y1 + uy * len, x1 - uy * 0.02 * h, y1 + ux * 0.02 * h, x1 + uy * 0.02 * h, y1 - ux * 0.02 * h]);
}
function swing(p, sx, sy, ang, h) {
  const ex = sx + Math.sin(ang) * 0.15 * h, ey = sy + Math.cos(ang) * 0.15 * h;
  const hx = ex + Math.sin(ang + 0.35) * 0.14 * h, hy = ey + Math.cos(ang + 0.35) * 0.14 * h;
  seg(p, sx, sy, ex, ey, hx, hy); return [hx, hy];
}
// arm pointing along angle th (0 = straight down, PI = straight up, positive = forward)
function armTo(p, sx, sy, th, h, bend = 0.25) {
  const ex = sx + Math.sin(th - bend) * 0.15 * h, ey = sy + Math.cos(th - bend) * 0.15 * h;
  const hx = ex + Math.sin(th + bend * 0.5) * 0.14 * h, hy = ey + Math.cos(th + bend * 0.5) * 0.14 * h;
  seg(p, sx, sy, ex, ey, hx, hy); return [hx, hy];
}
function blade(B, rk, hx, hy, th, len, h) {
  const tx = hx + Math.sin(th) * len, ty = hy + Math.cos(th) * len;
  seg(B.s('sword', 0.02 * h, rk.tint(COL.silver)), hx, hy, tx, ty);
  seg(B.s('pole', 0.021 * h, rk.sil), hx - Math.cos(th) * 0.05 * h, hy + Math.sin(th) * 0.05 * h, hx + Math.cos(th) * 0.05 * h, hy - Math.sin(th) * 0.05 * h);
  return [tx, ty];
}

// ------------------------------------------------------------------ foot soldiers
function foot(B, u, X, gy, rk, t) {
  const h = rk.h * u.k, ph = u.ph, s = Math.sin(ph), cs = Math.cos(ph), act = u.act;
  const amp = 0.42 * clamp(u.m, 0, 1.5), lean = (act === 'run' || act === 'flee' ? 0.06 : 0.03) * h * clamp(u.m, 0, 1);
  const jump = act === 'cheer' ? Math.pow(Math.max(0, Math.sin(t * 0.0055 + u.fo)), 2) * 0.05 * h : 0;
  const limb = B.s('limb', 0.056 * h, rk.sil), pole = B.s('pole', 0.02 * h, rk.sil);
  const hipX = X, hipY = gy - 0.455 * h - 0.03 * h * Math.abs(cs) * clamp(u.m, 0, 1) - jump;
  if (u.robe) {   // long robe instead of legs (the bishop)
    const col = rk.tint(u.robe);
    poly(B.f('robe', col), [hipX - 0.06 * h, hipY - 0.29 * h, hipX + 0.08 * h, hipY - 0.29 * h, hipX + 0.15 * h, gy, hipX - 0.13 * h, gy]);
  } else {
    for (const [a, bend] of [[amp * s, Math.max(0, cs) * 0.75 * clamp(u.m, 0, 1)], [-amp * s, Math.max(0, -cs) * 0.75 * clamp(u.m, 0, 1)]]) {
      const kx = hipX + Math.sin(a) * 0.245 * h, ky = hipY + Math.cos(a) * 0.245 * h;
      seg(limb, hipX, hipY, kx, ky, kx + Math.sin(a - bend) * 0.245 * h, ky + Math.cos(a - bend) * 0.245 * h);
    }
  }
  const nx = hipX + 0.035 * h + lean, ny = hipY - 0.29 * h, hx = nx + 0.012 * h + lean * 0.3, hy = ny - 0.085 * h;
  seg(limb, hipX, hipY, nx, ny);
  const sy = ny + 0.02 * h, aSw = -0.35 * s * clamp(u.m, 0.15, 1.3);
  const fighting = act === 'fight', cheering = act === 'cheer';

  if (u.type === 'spear') {
    swing(limb, nx, sy, aSw, h);
    if (fighting) {
      const jab = Math.max(0, Math.sin(t * 0.011 + u.fo)) * 0.1 * h, hx2 = nx + 0.12 * h + jab, hy2 = ny + 0.12 * h;
      seg(limb, nx, sy, nx + 0.06 * h + jab * 0.5, ny + 0.16 * h, hx2, hy2);
      const x0 = hx2 - 0.45 * h, y0 = hy2 + 0.02 * h, x1 = hx2 + 0.7 * h, y1 = hy2 - 0.04 * h;
      seg(pole, x0, y0, x1, y1); tip(B, rk, x0, y0, x1, y1, h, 0.08 * h);
    } else if (cheering) {
      const [hx2, hy2] = armTo(limb, nx, sy, Math.PI - 0.25, h, 0.1);
      const x0 = hx2 - 0.03 * h, y0 = hy2 + 0.35 * h, x1 = hx2 + 0.05 * h, y1 = hy2 - 0.9 * h;
      seg(pole, x0, y0, x1, y1); tip(B, rk, x0, y0, x1, y1, h, 0.08 * h);
    } else {
      const hx2 = nx + 0.1 * h, hy2 = ny + 0.08 * h;
      seg(limb, nx, sy, nx + 0.07 * h, ny + 0.14 * h, hx2, hy2);
      const x0 = hx2 - 0.03 * h, y0 = hy2 + 0.36 * h, x1 = hx2 + 0.09 * h, y1 = hy2 - 0.9 * h;
      seg(pole, x0, y0, x1, y1); tip(B, rk, x0, y0, x1, y1, h, 0.08 * h);
    }
  } else if (u.type === 'knight') {
    if (fighting) {
      const th = 2.2 + 0.95 * Math.sin(t * 0.012 + u.fo);
      const [hx2, hy2] = armTo(limb, nx, sy, th, h); blade(B, rk, hx2, hy2, th, 0.32 * h, h);
    } else if (cheering) {
      const th = Math.PI - 0.15 + 0.15 * Math.sin(t * 0.008 + u.fo);
      const [hx2, hy2] = armTo(limb, nx, sy, th, h, 0.1); blade(B, rk, hx2, hy2, th, 0.32 * h, h);
    } else {
      swing(limb, nx, sy, -aSw, h);
      seg(pole, hipX + 0.02 * h, hipY - 0.03 * h, hipX - 0.2 * h, hipY + 0.16 * h);
    }
    seg(limb, nx, sy, nx + 0.06 * h, ny + 0.15 * h, nx + 0.1 * h, ny + 0.17 * h);
  } else if (u.type === 'archer') {
    if (act === 'shoot') {
      const hx2 = nx + 0.22 * h, hy2 = ny + 0.0 * h, draw = 0.5 + 0.5 * Math.sin(t * 0.0045 + u.fo);
      seg(limb, nx, sy, nx + 0.11 * h, ny + 0.0 * h, hx2, hy2);
      const dx = nx - 0.02 * h - draw * 0.05 * h;
      seg(limb, nx, sy, nx + 0.06 * h, ny + 0.06 * h, dx, ny + 0.01 * h);
      const bw = B.s('bow', 0.018 * h, rk.sil);
      ell(bw, hx2, hy2, 0.05 * h, 0.21 * h, -0.12, -Math.PI / 2, Math.PI / 2);
      seg(B.s('pole', 0.008 * h, rk.metal), hx2 + Math.sin(-0.12) * 0.21 * h, hy2 - 0.21 * h, dx, ny + 0.01 * h, hx2 - Math.sin(-0.12) * 0.21 * h, hy2 + 0.21 * h);
    } else if (cheering) {
      armTo(limb, nx, sy, Math.PI - 0.3, h, 0.1); armTo(limb, nx, sy, Math.PI + 0.3, h, 0.1);
    } else {
      swing(limb, nx, sy, aSw, h); swing(limb, nx, sy, -aSw, h);
      ell(B.s('bow', 0.018 * h, rk.sil), nx - 0.04 * h, ny + 0.13 * h, 0.24 * h, 0.05 * h, -1.15, 0.1, Math.PI - 0.1);
    }
  } else if (u.type === 'banner' || u.type === 'bishop') {
    swing(limb, nx, sy, aSw, h);
    const pump = cheering ? Math.max(0, Math.sin(t * 0.0055 + u.fo)) * 0.08 * h : 0;
    const px = nx + 0.09 * h, py = ny + 0.06 * h - pump;
    seg(limb, nx, sy, nx + 0.06 * h, ny + 0.13 * h - pump, px, py);
    const top = py - (u.type === 'bishop' ? 1.2 : 1.05) * h;
    seg(pole, px, py + 0.42 * h, px, top);
    if (u.type === 'bishop') {   // the True Cross
      const g = B.f('gold', rk.tint(COL.gold));
      g.rect(px - 0.022 * h, top - 0.3 * h, 0.044 * h, 0.36 * h);
      g.rect(px - 0.11 * h, top - 0.22 * h, 0.22 * h, 0.042 * h);
      B.glows.push([px, top - 0.2 * h, h]);
    } else B.flags.push({ x: px, y: top + 0.02 * h, len: 0.48 * h, ht: 0.3 * h, d: u.flag, o: u.fo, f: rk.f, taper: 0.1 });
  }
  tabard(B, u, rk, nx, ny, hipX, hipY, h, 0.12);
  if (u.type === 'knight') {
    if (u.sar) roundShield(B, rk, nx + 0.11 * h, ny + 0.19 * h, 0.095 * h, rk.tint(u.shield));
    else heater(B, nx + 0.11 * h, ny + 0.2 * h, 0.16 * h, 0.23 * h, rk.tint(u.shield), rk.tint(u.shieldX), rk.s > 0.33);
  } else if (u.type === 'spear' && u.sar && rk.s > 0.3) roundShield(B, rk, nx - 0.04 * h, ny + 0.16 * h, 0.085 * h, rk.tint(u.shield));
  headgear(B, u, rk, hx, hy, h);
}

// ------------------------------------------------------------------ horses and riders
function horse(B, u, X, gy, rk, t, h, col, colFar) {
  const ph = u.ph, gal = clamp(u.m - 1, 0, 1), amp = (0.36 + gal * 0.22) * clamp(u.m, 0, 1);
  const bob = (0.018 + gal * 0.03) * h * Math.abs(Math.sin(ph * 2)) * clamp(u.m, 0, 1);
  const bx = X, by = gy - 0.5 * h - bob;
  const offs = gal > 0.5 ? [[0.22, 0.1, 1], [-0.3, 0.55, 1], [0.25, 0.0, 0], [-0.27, 0.45, 0]] : [[0.22, 0.75, 1], [-0.3, 0.5, 1], [0.25, 0.25, 0], [-0.27, 0, 0]];
  for (const [lx, o, far] of offs) {
    const q = ph + o * TAU, a = amp * Math.sin(q), bend = Math.max(0, Math.cos(q)) * 0.9 * clamp(u.m, 0, 1);
    const tx = bx + lx * h, ty = by + 0.06 * h;
    const kx = tx + Math.sin(a) * 0.22 * h, ky = ty + Math.cos(a) * 0.22 * h;
    seg(far ? B.s('hLegFar:' + colFar, 0.05 * h, colFar) : B.s('hLeg:' + col, 0.052 * h, col),
      tx, ty, kx, ky, kx + Math.sin(a - bend) * 0.22 * h, ky + Math.cos(a - bend) * 0.22 * h);
  }
  const nod = (0.025 + gal * 0.03) * h * Math.sin(ph * 2) * clamp(u.m, 0.3, 1), stretch = gal * 0.06 * h;
  const sway = 0.04 * h * Math.sin(t * 0.0021 + u.fo) + gal * 0.05 * h;
  seg(B.s('hBody:' + col, 0.25 * h, col), bx - 0.3 * h, by, bx + 0.24 * h, by - 0.02 * h);
  seg(B.s('hNeck:' + col, 0.12 * h, col), bx + 0.2 * h, by - 0.05 * h, bx + 0.38 * h + stretch, by - 0.3 * h + nod + stretch);
  seg(B.s('hHead:' + col, 0.09 * h, col), bx + 0.38 * h + stretch, by - 0.3 * h + nod + stretch, bx + 0.53 * h + stretch * 1.4, by - 0.19 * h + nod + stretch * 0.8);
  poly(B.f('hHead:e' + col, col), [bx + 0.35 * h + stretch, by - 0.33 * h + nod + stretch, bx + 0.37 * h + stretch, by - 0.42 * h + nod + stretch, bx + 0.4 * h + stretch, by - 0.33 * h + nod + stretch]);
  const tail = B.s('hTail:' + col, 0.045 * h, col);
  tail.moveTo(bx - 0.4 * h, by - 0.05 * h); tail.quadraticCurveTo(bx - 0.55 * h + sway, by + 0.04 * h - gal * 0.08 * h, bx - 0.52 * h + sway * 1.5 - gal * 0.1 * h, by + 0.3 * h - gal * 0.2 * h);
  return { bx, by, nod: nod + stretch };
}
function caparison(B, u, rk, bx, by, h, t, col, xcol) {
  const pts = [bx - 0.42 * h, by - 0.11 * h, bx + 0.3 * h, by - 0.12 * h, bx + 0.36 * h, by + 0.2 * h];
  const fl = 1 + clamp(u.m - 1, 0, 1) * 2;
  for (let i = 0; i <= 8; i++) {
    const k = i / 8;
    pts.push(bx + 0.36 * h - k * 0.8 * h - k * k * 0.06 * h * (fl - 1), by + 0.2 * h + Math.sin(k * 9 + t * 0.006 * fl + u.fo) * 0.016 * h * fl + k * 0.02 * h - k * (fl - 1) * 0.04 * h);
  }
  poly(B.f('capa:' + col, col), pts);

    const p = B.f('capaX:' + xcol, xcol);

const ROWS_Y = [0.668, 0.69, 0.722, 0.76, 0.805];
const sOfY = y => 0.3 + (y - 0.645) / 0.355 * 0.95;
let rows = [], front = [], arrows = [], sparks = [], dustB = [], dustF = [], birds = [], fleers = [], charge = null;

function buildBattle(spreadC, spreadS) {
  rows = ROWS_Y.map(yf => ({ y: yf * H, s: sOfY(yf), rk: rankStyle(sOfY(yf)), units: [] }));
  for (const R of rows) {
    const h = R.rk.h;
    for (const [side, a, b] of [['C', spreadC[0], spreadC[1]], ['S', spreadS[0], spreadS[1]]]) {
      let px = a * W;
      while (px < b * W) {
        const u = side === 'C' ? crusader(CMIX(Math.random())) : saracen(SMIX(Math.random()));
        u.bx = px; u.x = px; u.px = px; u.routDelay = rnd(0, 2.5); u.routSp = rnd(0.8, 1.25); u.dy = rnd(-0.004, 0.004) * H;
        R.units.push(u);
        px += h * (u.type === 'mounted' ? rnd(0.85, 1.1) : rnd(0.3, 0.5));
      }
    }
    if (spreadS[0] < 2 && R === rows[rows.length - 1]) {
      const sal = { side: 'S', sar: true, type: 'mounted', weapon: 'sword', saladin: true, tab: '#efe6d6', capa: '#d9a925', helm: 'turban', turbCol: '#efe6d6', turbSpike: true,
        horse: '#5a3a2a', shield: '#c9a23a', ph: 0, fo: 1, k: 1.04, m: 0, act: 'stand', bx: 1.0 * W, routDelay: -0.8, routSp: 1.35, dy: 0 };
      const bearer = Object.assign(saracen('mounted'), { big: true, flag: 'ayy', bx: 1.07 * W, routDelay: -0.6, routSp: 1.3, dy: 0, capa: '#d9a925' });
      for (const u of [sal, bearer]) { u.x = u.px = u.bx; R.units.push(u); }
    }
    // pack order (0 = front of their side) used when the lines compress into a melee
    const cs = R.units.filter(u => u.side === 'C').sort((p, q) => q.bx - p.bx), ss = R.units.filter(u => u.side === 'S').sort((p, q) => p.bx - q.bx);

  g.addColorStop(0, 'rgba(255,248,225,0.95)'); g.addColorStop(0.3, 'rgba(255,210,130,0.35)'); g.addColorStop(1, 'rgba(255,190,100,0)');
  x.fillStyle = g; x.fillRect(gx - r, gy - r, r * 2, r * 2); x.restore();
}

// ------------------------------------------------------------------ city banners
function cityBanners(t, main, extra) {
  const list = [], pole = new Path2D();
  TOWERS.forEach((tw, i) => {
    const k = tw.main ? main : clamp(extra * 1.6 - (i / TOWERS.length) * 0.6, 0, 1);
    if (k <= 0) return;
    const ph = (tw.main ? 0.08 : 0.032) * H, top = tw.y - ph;
    pole.moveTo(tw.x, tw.y); pole.lineTo(tw.x, top);
    const fh = (tw.main ? 0.032 : 0.011) * H, fy = lerp(tw.y - fh * 1.1, top, k);
    list.push({ x: tw.x, y: fy, len: fh * 1.6, ht: fh, d: tw.main ? 'jerusalem' : (i % 3 === 0 ? 'templar' : 'jerusalem'), o: i * 1.3, f: 0.35, taper: 0.05, big: tw.main });
  });
  x.strokeStyle = '#3a1f30'; x.lineWidth = 1.4 * U; x.stroke(pole);
  drawFlags(list, t);
  if (main > 0.98) {   // the moment the city is theirs: a warm pulse over the walls
    const p = TOWERS[0], g = x.createRadialGradient(p.x, p.y, 0, p.x, p.y, 0.35 * W);
    x.save(); x.globalCompositeOperation = 'lighter';
    g.addColorStop(0, `rgba(255,220,150,${0.18 * (0.6 + 0.4 * Math.sin(t * 0.002))})`); g.addColorStop(1, 'rgba(255,200,120,0)');
    x.fillStyle = g; x.fillRect(p.x - 0.35 * W, p.y - 0.35 * W, 0.7 * W, 0.7 * W); x.restore();
  }
}

// ------------------------------------------------------------------ victory tableau
function buildVictory() {
  buildBattle([-0.05, 0.62], [5, 5]);
  for (const R of rows) for (const u of R.units) { u.x = u.bx; u.face = 1; u.act = 'cheer'; u.m = 0; u.ph = 0; if (u.type === 'mounted') u.lance = 0; }
  front = [
    { gy: 0.89, s: 0.88, u: Object.assign(crusader('mounted'), { x: 0.06 * W, big: true, flag: 'beauseant', fac: 'templar', tab: COL.templar, tabX: COL.templarX, capa: COL.templar, capaX: COL.templarX, helm: 'great', face: 1, act: 'cheer', m: 0 }) },
    { gy: 0.9, s: 0.9, u: Object.assign(crusader('mounted'), { x: 0.15 * W, big: true, flag: 'jerusalem', tab: '#2d3d6b', tabX: COL.gold, helm: 'nasal', horse: '#4a2c1c', face: 1, act: 'cheer', m: 0 }) },
    { gy: 0.935, s: 1.06, u: { side: 'C', type: 'mounted', king: true, weapon: 'sword', tab: '#e4d8c6', tabX: COL.gold, capa: '#ece2d2', capaX: COL.gold, horse: '#e9ddd0', x: 0.27 * W, face: 1, act: 'cheer', m: 0, ph: 0, fo: 0.5, k: 1 } },
    { gy: 0.945, s: 0.98, u: { side: 'C', type: 'bishop', robe: '#efe6d6', helm: 'mitre', x: 0.38 * W, face: 1, act: 'stand', m: 0, ph: 0, fo: 1, k: 1 } },
    { gy: 0.95, s: 1.0, u: Object.assign(crusader('knight'), { x: 0.47 * W, fac: 'hosp', tab: COL.hosp, tabX: COL.hospX, shield: COL.hosp, shieldX: COL.hospX, helm: 'great', face: 1, act: 'cheer', m: 0 }) },
  ];
  // Saladin's host streaming away over the far dunes
  fleers = Array.from({ length: 70 }, () => ({ x: rnd(0.66, 1.1) * W, y: horizon + rnd(0.004, 0.02) * H, sp: rnd(0.025, 0.05) * W, ph: rnd(0, TAU), mt: Math.random() < 0.35 }));
  birds = Array.from({ length: 14 }, () => ({ x: rnd(-0.3, 1) * W, y: rnd(0.1, 0.35) * H, sp: rnd(0.025, 0.05) * W, ph: rnd(0, TAU), sz: rnd(0.6, 1.1) }));
}
function drawFleers(dt) {
  x.fillStyle = mixc(SIL, HAZE, 0.55); x.strokeStyle = x.fillStyle; x.lineWidth = 1.2 * U;
  for (const f of fleers) {
    f.x += f.sp * dt * 0.2; f.ph += dt * 10; if (f.x > 1.12 * W) f.x = 0.64 * W;
    const s = 0.005 * H, bob = Math.abs(Math.sin(f.ph)) * s * 0.3;
    if (f.mt) { x.fillRect(f.x - s * 1.4, f.y - s * 1.2 - bob, s * 2.8, s * 0.8); x.fillRect(f.x - s * 0.2, f.y - s * 2.6 - bob, s * 0.4, s * 1.4); }
    else { x.fillRect(f.x - s * 0.2, f.y - s * 1.8 - bob, s * 0.45, s * 1.8); }
    if (Math.random() < dt * 0.4) spawnDust(dustB, f.x - 0.01 * W, f.y, 0.25, 0, 1);
  }
}
function drawBirds(dt, t) {
  x.strokeStyle = mixc(SIL, HAZE, 0.25); x.lineCap = 'round';
  for (const b of birds) {
    b.x += b.sp * dt; if (b.x > 1.1 * W) { b.x = -0.1 * W; b.y = rnd(0.1, 0.35) * H; }
    const fl = Math.sin(t * 0.012 + b.ph) * 0.6, sp = 16 * U * b.sz;
    x.lineWidth = 2.2 * U * b.sz; x.beginPath();
    x.moveTo(b.x - sp, b.y - sp * (0.2 + fl * 0.5)); x.quadraticCurveTo(b.x - sp * 0.45, b.y - sp * 0.3, b.x, b.y);
    x.quadraticCurveTo(b.x + sp * 0.45, b.y - sp * 0.3, b.x + sp, b.y - sp * (0.2 + fl * 0.5)); x.stroke();
  }
}

// ------------------------------------------------------------------ the charge (mode 3)
function buildCharge() {
  const ys = [0.715, 0.765, 0.83];
  charge = { rows: ys.map(yf => ({ y: yf * H, s: sOfY(yf), rk: rankStyle(sOfY(yf)), units: [] })), waves: [], lastWave: -99 };
  charge.rows.forEach((R, ri) => {
    let px = -0.06 * W + ri * 0.03 * W;
    while (px < 0.64 * W) {
      const u = crusader('mounted'); u.cx = px; u.face = 1; u.lance = 1; u.m = 1.6; u.act = 'run'; u.sway = rnd(0, TAU);
      R.units.push(u); px += R.rk.h * rnd(0.75, 1.0);
    }
  });
  charge.king = { gy: 0.935, s: 1.05, u: { side: 'C', type: 'mounted', king: true, weapon: 'sword', tab: '#e4d8c6', tabX: COL.gold, capa: '#ece2d2', capaX: COL.gold, horse: '#e9ddd0', face: 1, act: 'run', m: 1.6, ph: 0, fo: 0.4, k: 1 } };
  charge.banner = { gy: 0.905, s: 0.92, u: Object.assign(crusader('mounted'), { big: true, flag: 'jerusalem', tab: '#2d3d6b', tabX: COL.gold, helm: 'nasal', horse: '#4a2c1c', face: 1, act: 'run', m: 1.6 }) };
}
const CV = () => 430 * U;    // charge speed at depth 1
function spawnWave(lt) {
  const w = { t0: lt, rows: charge.rows.map(R => []) };
  charge.rows.forEach((R, ri) => {
    let px = 1.08 * W + rnd(0, 0.06) * W;
    const n = 5 + Math.floor(rnd(0, 4));
    for (let i = 0; i < n; i++) {
      const u = saracen(SMIX(Math.random())); u.sx = px; u.m = 1; u.face = -1; u.hit = false; u.vS = rnd(60, 110) * U * R.s; u.vF = rnd(0.45, 0.62);
      w.rows[ri].push(u); px += R.rk.h * rnd(0.35, 0.7);
    }
  });
  charge.waves.push(w);
}
function drawCharge(lt, dt, t) {
  if (lt - charge.lastWave > 9 && lt < 33) { spawnWave(lt); charge.lastWave = lt; }
  const V = CV(), lineX = 0.66 * W;
  charge.rows.forEach((R, ri) => {
    const list = [];
    for (const u of R.units) {
      u.x = u.cx + Math.sin(t * 0.0009 + u.sway) * 0.012 * W;
      u.ph += TAU * V * R.s / (1.15 * R.rk.h) * dt; u.act = 'run';
      if (Math.random() < dt * 1.2) spawnDust(dustB, u.x - 0.3 * R.rk.h, R.y, R.s, -V * R.s * 0.6, 1);
      list.push([u, R.y]);
    }
    for (const w of charge.waves) for (const u of w.rows[ri]) {
      const rel = V * R.s;
      if (!u.hit) {
        u.sx -= (rel + u.vS) * dt; u.act = 'run'; u.face = -1;
        u.ph += TAU * u.vS / ((u.type === 'mounted' ? 1.15 : 0.735) * R.rk.h) * dt;
        if (u.sx < lineX + 0.2 * R.rk.h) {
          u.hit = true;
          for (let k = 0; k < 3; k++) spark(u.sx + rnd(-0.2, 0.2) * R.rk.h, R.y - rnd(0.4, 0.9) * R.rk.h, R.s);
          spawnDust(dustB, u.sx, R.y, R.s, -rel * 0.5, 3, true);
        }
      } else {
        u.sx -= (rel - rel * u.vF) * dt; u.face = 1; u.act = 'flee';
        u.ph += TAU * rel * u.vF / ((u.type === 'mounted' ? 1.15 : 0.735) * R.rk.h) * dt;
      }
      u.x = u.sx; u.m = 1.6; list.push([u, R.y]);
    }
    drawGroup(list, R.rk, t, R.rk.rimOn);
  });
  charge.waves = charge.waves.filter(w => w.rows.some(r => r.some(u => u.sx > -0.3 * W)));
  // heroes in front: the Jerusalem banner and the king, sword forward
  for (const e of [charge.banner, charge.king]) {
    const rk = rankStyle(e.s), u = e.u;
    u.x = (e === charge.king ? 0.42 : 0.3) * W + Math.sin(t * 0.0007 + (e === charge.king ? 1 : 2)) * 0.015 * W;
    u.ph += TAU * V * e.s / (1.15 * rk.h) * dt; u.m = 1.6; u.act = 'run';
    const B = new Batch(); mounted(B, u, u.x, e.gy * H, rk, t); flushWith(B, rk, false, t, u);
    if (u.king && u.glint) glint(u.glint[0], u.glint[1], t);
    if (Math.random() < dt * 4) spawnDust(dustF, u.x - 0.3 * rk.h, e.gy * H, e.s, -V * e.s * 0.6, 1);
  }
}

// ------------------------------------------------------------------ setup
// Tall / portrait screens (a laptop stood on end): the battlefield is laid out in screen-width fractions, so
// squeezing it would crush the armies together. Instead, draw it at least MIN_AR wide and pan a camera
// over it so the king stays in frame. Wide and ultrawide screens use the full width as-is.
const MIN_AR = 0.95, FOCUS = { battle: 0.36, charge: 0.44, victory: 0.34 }[MODE] ?? 0.5;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const vw = innerWidth, vh = innerHeight, cw = Math.max(vw, Math.round(vh * MIN_AR));
  const shift = clamp(FOCUS * cw - vw / 2, 0, cw - vw);
  c.style.width = cw + 'px'; c.style.height = vh + 'px'; c.style.transform = shift ? `translateX(${-shift}px)` : '';
  W = c.width = Math.round(cw * dpr); H = c.height = Math.round(vh * dpr);
  U = H / 1000; horizon = 0.6 * H;
  buildSky();
  farDunes = duneTile(W * 2, horizon - 0.01 * H, horizon + 0.012 * H, 0.014 * H, [3, 7, 11], 'rgba(190,110,80,0.5)', 'rgba(255,205,140,0.35)', 1.2 * U);
  ripA = rippleTile(horizon + 0.01 * H, 0.7 * H, 260, 'rgba(255,205,140,0.35)', 'rgba(90,40,30,0.25)');
  ripB = rippleTile(0.7 * H, 0.84 * H, 220, 'rgba(255,195,130,0.3)', 'rgba(70,30,20,0.3)');
  ripC = rippleTile(0.84 * H, H, 160, 'rgba(255,185,120,0.25)', 'rgba(50,20,15,0.35)');
  fore = foreTile();
  vign = off(W, H); { const g = vign.getContext('2d'), v = g.createRadialGradient(W * 0.5, H * 0.55, H * 0.35, W * 0.5, H * 0.55, Math.max(W * 0.75, H * 0.6));
    v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(8,4,16,0.55)'); g.fillStyle = v; g.fillRect(0, 0, W, H); }
  makeDustSprite();
  arrows = []; sparks = []; dustB = []; dustF = [];
  if (MODE === 'victory') buildVictory();
  else {
    buildBattle([-0.13, 0.3], [0.73, 1.35]);
    front = makeBattleFront(); front.find(e => e.role === 'king').kneelX = 0.3;
    if (MODE === 'charge') buildCharge();
  }
}
addEventListener('resize', resize); resize();

// ------------------------------------------------------------------ frame
const LOOP = { battle: BT.end, charge: 89, victory: 1e9 };
let last = 0, prevLt = 0;
function frame(now) {
  if (startT === null) startT = now - T0 * 1000;
  const t = now, dt = Math.min(0.05, (now - (last || now)) / 1000); last = now;
  const lt = ((now - startT) / 1000) % LOOP[MODE];
  if (lt < prevLt) { arrows = []; sparks = []; dustB = []; dustF = []; if (MODE === 'charge') { charge.waves = []; charge.lastWave = -99; } }
  prevLt = lt;
  x.lineCap = 'round'; x.lineJoin = 'round';

  if (MODE === 'victory') return victoryFrame(t, dt);

  let inCharge = MODE === 'charge' && lt < 40;
  let bt = MODE === 'battle' ? lt : 44.5 + (lt - 40);
  if (inCharge) scroll += CV() * dt; else scroll = 0;
  const S = inCharge ? null : updateBattle(bt, dt, t);
  if (!inCharge) updateBattleFront(bt, dt, t, S);

  x.drawImage(skyC, 0, 0);
  godRays(t, inCharge ? 0.5 : S.rays);
  if (!inCharge) cityBanners(t, S.banner, S.extra);
  drawTile(farDunes, 0.03);
  drawTile(ripA, inCharge ? 0.4 : 0);
  if (inCharge) { drawTile(ripB, 0.65); drawCharge(lt, dt, t); drawTile(ripC, 1.0); drawDust(dustB, dt); }
  else {
    rows.forEach((R, i) => {
      if (i === 2) drawTile(ripB, 0);
      const list = R.units.map(u => [u, R.y + u.dy]);
      drawGroup(list, R.rk, t, R.rk.rimOn);
      if (i === 2) drawDust(dustB, dt);
    });
    drawArrows(dt); drawSparks(dt);
    drawTile(ripC, 0);
    const glows = drawFront(front, t, dt);
    const bishop = front.find(e => e.role === 'bishop');
    if (glows.length) {
      const k = MODE === 'battle' ? 0.55 + 0.45 * smooth(ramp(bt, 2, BT.kneelEnd)) + bump(bt, BT.kneelEnd, BT.flash, BT.ready) * 0.8 : 0.8;
      for (const [gx, gy, h] of glows) crossGlow(gx, gy, h, Math.min(1.4, k), t);
    }
    if (MODE === 'battle') overlay('#fff4d8', bump(bt, BT.kneelEnd + 0.5, BT.flash, BT.flash + 1.2) * 0.85);
  }
  drawSparks(dt);
  drawDust(dustF, dt);
  drawTile(fore, inCharge ? 1.3 : 0);
  x.drawImage(vign, 0, 0);
  // fades: dawn in, dust whiteouts between the charge and the victory
  if (MODE === 'battle') overlay('#120c16', Math.max(1 - ramp(lt, 0, 3), ramp(lt, BT.end - 3, BT.end)));
  if (MODE === 'charge') overlay('#e6b98a', Math.max(bump(lt, 38, 40, 42), bump(lt, 86, 89, 92), 1 - ramp(lt, 0, 2)));
  requestAnimationFrame(frame);
}
function victoryFrame(t, dt) {
  x.drawImage(skyC, 0, 0);
  godRays(t, 1);
  drawBirds(dt, t);
  cityBanners(t, 1, 1);
  drawTile(farDunes, 0);
  drawFleers(dt);
  drawTile(ripA, 0);
  rows.forEach((R, i) => {
    if (i === 3) drawTile(ripB, 0);
    for (const u of R.units) { u.act = Math.sin(t * 0.0009 - u.x / W * 6) > -0.2 ? 'cheer' : 'stand'; }
    drawGroup(R.units.map(u => [u, R.y + u.dy]), R.rk, t, R.rk.rimOn);
    if (i === 1) drawDust(dustB, dt);
  });
  drawTile(ripC, 0);
  for (const e of front) e.u.act = e.u.type === 'bishop' ? 'stand' : 'cheer';
  const glows = drawFront(front, t, dt);
  for (const [gx, gy, h] of glows) crossGlow(gx, gy, h, 1.1, t);
  drawDust(dustF, dt);
  drawTile(fore, 0);
  x.drawImage(vign, 0, 0);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
