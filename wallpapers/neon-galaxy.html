<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Neon Galaxy</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* web.walls — Neon Galaxy
   OLED-tuned GPU galaxy: true-black void, saturated nebulae, spinning spiral,
   3-layer parallax starfield, shooting stars. Renders at native pixel density
   and runs at the display's refresh rate. Everything drifts, spins and
   hue-cycles so no pixel holds the same colour for long (burn-in friendly).
   URL options: ?scale=0.75 (render scale), ?adaptive=0 (never drop resolution) */
(() => {
const qs = new URLSearchParams(location.search);
const USER_SCALE = Math.min(Math.max(parseFloat(qs.get('scale')) || 1, 0.25), 2);
const ADAPTIVE = qs.get('adaptive') !== '0';

const c = document.getElementById('c');
const gl = c.getContext('webgl', { antialias: false, alpha: false, depth: false, stencil: false,
  powerPreference: 'high-performance', desynchronized: true, preserveDrawingBuffer: false });
if (!gl) { document.body.style.background = '#000'; return; }

const VS = `attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}`;
const FS = `
precision highp float;
uniform vec2 R; uniform float T;
#define TAU 6.2831853

float h21(vec2 p){ vec3 q=fract(vec3(p.xyx)*.1031); q+=dot(q,q.yzx+33.33); return fract((q.x+q.y)*q.z); }
vec2  h22(vec2 p){ float n=h21(p); return vec2(n,h21(p+n+3.7)); }
float noise(vec2 p){ vec2 i=floor(p),f=fract(p),u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x),u.y); }
const mat2 M=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<4;i++){ v+=a*noise(p); p=M*p; a*=.5; } return v; }
mat2 rot(float a){ float s=sin(a),c=cos(a); return mat2(c,-s,s,c); }
// vivid cosine rainbow — full-saturation OLED candy
vec3 pal(float t){ return .5+.5*cos(TAU*(t+vec3(0.,.33,.67))); }
vec3 sat(vec3 c,float k){ float l=dot(c,vec3(.299,.587,.114)); return max(mix(vec3(l),c,k),0.); }

void main(){
  float t=T;
  float mn=min(R.x,R.y);
  vec2 p=(gl_FragCoord.xy-.5*R)/mn;          // short side spans -0.5..0.5; reflows for 21:9 & portrait
  vec2 ext=.5*R/mn;                           // visible half-extents
  float px=1./mn;                             // one device pixel in p units
  float hue=t*.0035;                          // full colour cycle every ~5 min

  // ---------- nebula clouds (domain-warped, crushed to true black) ----------
  vec2 np=p*1.15+vec2(t*.006,-t*.004);
  vec2 q=vec2(fbm(np+vec2(0.,t*.015)),fbm(np+vec2(5.2,1.3)-t*.012));
  vec2 r=vec2(fbm(np*1.3+2.8*q+vec2(1.7,9.2)+t*.02),fbm(np*1.3+2.8*q+vec2(8.3,2.8)-t*.017));
  float f=fbm(np*1.2+2.4*r);
  float neb=smoothstep(.42,.92,f); neb=neb*neb*1.9;
  vec3 col=sat(pal(hue+f*.7+r.x*.6),1.35)*neb;
  col+=sat(pal(hue+.5+q.y),1.3)*pow(smoothstep(.5,.85,r.y),3.)*.55;   // second contrasting veil

  // ---------- spiral galaxy (wanders, spins, wobbles in tilt) ----------
  vec2 gc=ext*vec2(.42*sin(t*.019),.32*sin(t*.027+1.3));
  float gs=.95+.18*sin(t*.011);
  vec2 g=rot(t*.008)*(p-gc)/gs;
  g.y/=.52+.22*sin(t*.009);
  float gr=length(g);
  float spin=t*.06;
  vec2 gp=rot(-spin)*g;
  float ga=atan(gp.y,gp.x);
  float sp=ga-log(gr+.002)*2.4;
  float arms=pow(.5+.5*cos(2.*sp),2.6);
  float dust=fbm(rot(gr*5.)*gp*7.+3.);
  float lanes=smoothstep(.52,.78,fbm(rot(gr*6.)*gp*13.+7.))*smoothstep(.04,.12,gr);
  float disk=exp(-gr*3.4);
  float body=disk*(.18+1.9*arms*(.45+.9*dust))*(1.-.75*lanes);
  vec3 gcol=sat(pal(hue+.08+gr*1.05),1.5);
  col+=gcol*body*1.5;
  // hot star-forming knots along the arms
  float knot=pow(noise(rot(gr*5.)*gp*38.),14.)*arms*disk*28.;
  col+=sat(pal(hue+.55+gr),1.4)*knot;
  // blazing core
  col+=vec3(1.,.86,.72)*(exp(-gr*gr*260.)*3.2+exp(-gr*16.)*.9);
  col+=gcol*exp(-gr*7.)*.35;

  // ---------- 3-layer parallax starfield ----------
  for(int i=0;i<3;i++){
    float fi=float(i);
    float sc=14.+fi*20.;
    vec2 drift=vec2(t*(.003+fi*.005),t*(.0012+fi*.0022));
    vec2 sq=(rot(.0007*t*(fi+1.))*p+drift)*sc;
    vec2 id=floor(sq), fp=fract(sq)-.5;
    float n=h21(id+fi*31.7);
    if(n>.6){
      vec2 o=(h22(id+fi*7.)-.5)*.5;
      vec2 dv=fp-o;
      float d=length(dv)/sc;
      float big=pow(h21(id+3.1+fi),6.);
      float sz=px*(.6+1.9*big);
      float tw=.55+.45*sin(t*(.7+3.5*n)+n*61.);
      float s=exp(-d*d/(sz*sz))*(1.4+2.6*big)*tw;
      s+=exp(-d/(px*(1.5+5.*big)))*.25*big*tw;
      s*=smoothstep(.25,.12,max(abs(dv.x),abs(dv.y)));   // no glow past the cell = no square halos
      vec3 sc3=mix(vec3(.62,.78,1.),vec3(1.,.82,.62),h21(id+9.2));
      if(h21(id+5.5)>.86) sc3=sat(pal(hue+n*3.),1.6);
      col+=sc3*s*(1.-fi*.18);
    }
  }

  // ---------- shooting stars ----------
  for(int i=0;i<3;i++){
    float fi=float(i);
    float per=6.5+fi*2.9;
    float k=floor(t/per+fi*.37);
    float ph=fract(t/per+fi*.37);
    if(ph<.22){
      float pr=ph/.22;
      vec2 hs=h22(vec2(k,fi*13.));
      vec2 st=(hs-.5)*ext*2.1;
      float ang=hs.x*TAU;
      vec2 dir=vec2(cos(ang),sin(ang));
      st-=dir*.35;
      vec2 head=st+dir*pr*1.15;
      vec2 rel=p-head;
      float al=dot(rel,-dir);
      float pe=abs(dot(rel,vec2(-dir.y,dir.x)));
      float w=px*1.6;
      float tr=step(0.,al)*smoothstep(.42,0.,al)*exp(-pe*pe/(w*w))*1.6;
      float hd=exp(-dot(rel,rel)/(w*w*4.))*4.;
      float fade=sin(pr*3.14159);
      col+=(sat(pal(hue+fi*.33+.2),1.4)*tr+vec3(1.)*hd)*fade;
    }
  }

  // ---------- tone map, keep blacks TRUE black, dither ----------
  col=1.-exp(-col*1.3);
  col=sat(col,1.12);
  col=max(col-.008,0.)/(1.-.008);
  float on=step(.002,max(col.r,max(col.g,col.b)));
  col+=(h21(gl_FragCoord.xy+fract(t*7.13)*97.)-.5)/255.*on;
  gl_FragColor=vec4(clamp(col,0.,1.),1.);
}`;

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const pr = gl.createProgram();
gl.attachShader(pr, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(pr); gl.useProgram(pr);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(pr, 'a');
gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const uR = gl.getUniformLocation(pr, 'R'), uT = gl.getUniformLocation(pr, 'T');

// ---- native-resolution sizing (exact device pixels when the browser reports them) ----
let cssW = innerWidth, cssH = innerHeight, devW = 0, devH = 0, scale = USER_SCALE;
function apply() {
  const dpr = window.devicePixelRatio || 1;
  const w = devW || Math.round(cssW * dpr), h = devH || Math.round(cssH * dpr);
  c.width = Math.max(1, Math.round(w * scale));
  c.height = Math.max(1, Math.round(h * scale));
  gl.viewport(0, 0, c.width, c.height);
}
try {
  new ResizeObserver(e => {
    const en = e[0];
    cssW = en.contentRect.width; cssH = en.contentRect.height;
    const d = en.devicePixelContentBoxSize && en.devicePixelContentBoxSize[0];
    devW = d ? d.inlineSize : 0; devH = d ? d.blockSize : 0;
    apply();
  }).observe(c, { box: 'device-pixel-content-box' });
} catch (_) {
  addEventListener('resize', () => { cssW = innerWidth; cssH = innerHeight; devW = devH = 0; apply(); });
}
apply();

// ---- adaptive guard: only steps resolution down if the GPU truly can't hold refresh rate ----
let last = 0, ivs = [], target = 0, slow = 0;
function adapt(dt) {
  if (!ADAPTIVE) return;
  if (!target) { ivs.push(dt); if (ivs.length === 90) { ivs.sort((a, b) => a - b); target = ivs[45]; } return; }
  if (dt > target * 1.45) slow++; else slow = Math.max(0, slow - 1);
  if (slow > 45 && scale > USER_SCALE * 0.5) { scale *= 0.9; slow = 0; apply(); }
}

const t0 = performance.now(), LOOP = 1800, DIP = 0.8, seed = 0;   // clock loops every 30 min (see gen_oled.py)
let dipped = false;
let raf = 0;
function frame(now) {
  raf = requestAnimationFrame(frame);
  if (last) adapt(now - last);
  last = now;
  gl.uniform2f(uR, c.width, c.height);
  const tt = (((now - t0) / 1000) % LOOP + LOOP) % LOOP, edge = Math.min(tt, LOOP - tt), op = Math.max(0, Math.min(1, edge / DIP));
  if (op < 1 || dipped) { c.style.opacity = op.toFixed(3); dipped = op < 1; }
  gl.uniform1f(uT, tt + 37);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
  else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
});
c.addEventListener('webglcontextlost', e => { e.preventDefault(); cancelAnimationFrame(raf); raf = 0; });
c.addEventListener('webglcontextrestored', () => location.reload());
raf = requestAnimationFrame(frame);
})();
</script>
</body>
</html>
