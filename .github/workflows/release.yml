name: Release web.walls

# Every push to main: read the version from src/WebWalls.csproj. If there's no GitHub Release for that
# version yet, build WebWalls.exe, wrap it in the installer, and publish Release vX.Y.Z with the
# installer attached. So to ship a new version: bump <Version> in the csproj and push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = ([xml](Get-Content src/WebWalls.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "version=$v" >> $env:GITHUB_OUTPUT
          gh release view "v$v" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { "exists=true" >> $env:GITHUB_OUTPUT; Write-Host "Release v$v already exists, nothing to do." }
          else { "exists=false" >> $env:GITHUB_OUTPUT; Write-Host "Building release v$v" }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          dotnet-version: '8.0.x'

      - name: Build WebWalls.exe
        if: steps.ver.outputs.exists == 'false'
        run: >
          dotnet publish src/WebWalls.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -o dist

      - name: Build the installer
        if: steps.ver.outputs.exists == 'false'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc -and (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DAppVersion=${{ steps.ver.outputs.version }}" installer\WebWalls.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish the release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          gh release create "v$v" "release\WebWalls-Setup-$v.exe" --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" --title "web.walls $v" --notes-file RELEASE_NOTES.md
